<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>US Education Levels | Interactive Choropleth Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3.0.2/dist/topojson.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      text-align: center;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      color: #111827;
      min-height: 100vh;
    }

    header {
      max-width: 64rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    #description {
      font-size: 1.125rem;
      color: #4b5563;
      max-width: 42rem;
      margin: 0 auto;
    }

    main {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0 1rem 2.5rem;
    }

    .card {
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .card-content {
      padding: 1rem;
    }

    @media (min-width: 768px) {
      .card-content {
        padding: 1.5rem;
      }
    }

    #map-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }

    svg#choropleth-map {
      min-width: 800px;
    }

    #legend {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 4rem;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background-color: rgba(17, 24, 39, 0.9);
      color: white;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      transition: opacity 150ms;
      visibility: hidden;
      opacity: 0;
    }

    .county {
      stroke: #ffffff;
      stroke-width: 0.1;
    }

    .county:hover {
      stroke: #1a202c;
      stroke-width: 1.5;
    }

    .source-info {
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 1rem;
    }

    .source-link {
      color: #2563eb;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 24rem;
    }

    .spinner {
      animation: spin 1s linear infinite;
      height: 3rem;
      width: 3rem;
      border-radius: 9999px;
      border-width: 2px;
      border-style: solid;
      border-color: transparent;
      border-bottom-color: #2563eb;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">United States Education Levels</h1>
    <p id="description">Percentage of adults age 25 and older with a bachelor's degree or higher (2010-2014)</p>
  </header>

  <main>
    <div class="card">
      <div class="card-content">
        <div id="loading" class="loading-spinner">
          <div class="spinner"></div>
        </div>
        <div id="error" style="display: none;" class="text-center p-10 text-red-600">
          <p class="text-xl mb-3">Error loading map data</p>
          <p id="error-message">Failed to fetch data. Please try again later.</p>
        </div>
        <div id="map-container">
          <svg id="choropleth-map" width="960" height="600" aria-label="US education levels choropleth map"></svg>
        </div>
        <div id="legend" aria-label="Map color legend"></div>
      </div>
    </div>

    <div class="source-info">
      <p>
        Source: 
        <a href="https://www.ers.usda.gov/data-products/county-level-data-sets/download-data.aspx" 
          class="source-link" target="_blank" rel="noopener noreferrer">
          USDA Economic Research Service
        </a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const loadingElement = document.getElementById('loading');
      const errorElement = document.getElementById('error');
      const errorMessageElement = document.getElementById('error-message');
      const mapContainer = document.getElementById('map-container');
      const svg = document.getElementById('choropleth-map');
      const legend = document.getElementById('legend');
      
      // URLs for data fetching
      const educationDataUrl = "https://cdn.freecodecamp.org/testable-projects-fcc/data/choropleth_map/for_user_education.json";
      const countyDataUrl = "https://cdn.freecodecamp.org/testable-projects-fcc/data/choropleth_map/counties.json";
      
      // Create tooltip div if it doesn't exist
      let tooltip = document.getElementById('tooltip');
      if (!tooltip) {
        tooltip = document.createElement('div');
        tooltip.id = 'tooltip';
        document.body.appendChild(tooltip);
      }
      
      // Fetch the data
      Promise.all([
        fetch(educationDataUrl).then(response => {
          if (!response.ok) throw new Error("Failed to fetch education data");
          return response.json();
        }),
        fetch(countyDataUrl).then(response => {
          if (!response.ok) throw new Error("Failed to fetch county data");
          return response.json();
        })
      ]).then(([educationData, countyData]) => {
        // Hide loading spinner once data is loaded
        if (loadingElement) loadingElement.style.display = 'none';
        
        // Process data
        const counties = topojson.feature(countyData, countyData.objects.counties).features;
        const states = topojson.mesh(countyData, countyData.objects.states, (a, b) => a !== b);
        
        // Create education data lookup map
        const educationMap = new Map(educationData.map(d => [d.fips, d]));
        
        // Calculate education range
        const minEdu = d3.min(educationData, d => d.bachelorsOrHigher) || 0;
        const maxEdu = d3.max(educationData, d => d.bachelorsOrHigher) || 100;
        
        // Create color scale - using 9 steps for more granular visualization
        const colorScale = d3.scaleQuantize()
          .domain([minEdu, maxEdu])
          .range([
            "#edf2ff", // lightest blue
            "#dbeafe",
            "#bfdbfe",
            "#93c5fd",
            "#60a5fa",
            "#3b82f6",
            "#2563eb",
            "#1d4ed8",
            "#1e40af"  // darkest blue
          ]);
        
        // Set dimensions
        const width = 960;
        const height = 600;
        
        // Configure SVG
        d3.select(svg)
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("preserveAspectRatio", "xMidYMid meet");
        
        // Draw counties
        d3.select(svg).append("g")
          .selectAll("path")
          .data(counties)
          .enter()
          .append("path")
          .attr("class", "county")
          .attr("data-fips", d => d.id)
          .attr("data-education", d => educationMap.get(d.id)?.bachelorsOrHigher || 0)
          .attr("d", d3.geoPath())
          .attr("fill", d => colorScale(educationMap.get(d.id)?.bachelorsOrHigher || 0))
          .on("mouseover", function(event, d) {
            const edu = educationMap.get(d.id);
            
            // Highlight hovered county
            d3.select(this)
              .attr("stroke-width", 1.5)
              .attr("stroke", "#1a202c");
            
            if (edu) {
              // Update tooltip content and position
              tooltip.style.visibility = 'visible';
              tooltip.style.opacity = '1';
              tooltip.style.left = (event.pageX + 15) + 'px';
              tooltip.style.top = (event.pageY - 28) + 'px';
              tooltip.setAttribute('data-education', edu.bachelorsOrHigher);
              tooltip.innerHTML = `
                <div style="font-weight: 500">${edu.area_name}, ${edu.state}</div>
                <div style="color: #bfdbfe">${edu.bachelorsOrHigher}% with Bachelor's degree</div>
              `;
            }
          })
          .on("mousemove", function(event) {
            // Update tooltip position when mouse moves
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 28) + 'px';
          })
          .on("mouseout", function() {
            // Revert highlight and hide tooltip
            d3.select(this)
              .attr("stroke-width", 0.1)
              .attr("stroke", "#ffffff");
            
            tooltip.style.visibility = 'hidden';
            tooltip.style.opacity = '0';
          });
        
        // Draw state borders
        d3.select(svg).append("path")
          .datum(states)
          .attr("fill", "none")
          .attr("stroke", "#333")
          .attr("stroke-width", 0.7)
          .attr("d", d3.geoPath());
        
        // Create Legend
        const legendWidth = 320;
        const legendHeight = 50;
        const legendColorWidth = legendWidth / 9; // 9 color steps
        
        const legendSvg = d3.select(legend)
          .append("svg")
          .attr("width", legendWidth + 60) // Add padding
          .attr("height", legendHeight);
        
        // Add color rectangles
        legendSvg.selectAll("rect")
          .data(colorScale.range())
          .enter()
          .append("rect")
          .attr("x", (d, i) => i * legendColorWidth + 30)
          .attr("y", 10)
          .attr("width", legendColorWidth)
          .attr("height", 10)
          .attr("fill", d => d);
        
        // Create scale for the axis
        const legendScale = d3.scaleLinear()
          .domain([minEdu, maxEdu])
          .range([0, legendWidth]);
        
        // Create and add the axis
        const legendAxis = d3.axisBottom(legendScale)
          .tickSize(3)
          .tickValues(d3.range(minEdu, maxEdu + 3, 6))
          .tickFormat(d => `${Math.round(d)}%`);
        
        legendSvg.append("g")
          .attr("transform", `translate(30, 20)`)
          .call(legendAxis)
          .selectAll("text")
          .attr("font-size", "10px")
          .attr("y", 10);
        
        // Handle resize
        const handleResize = () => {
          if (!mapContainer) return;
          
          const containerWidth = mapContainer.clientWidth;
          
          // Adjust map size for small screens
          if (containerWidth < 800) {
            const scale = containerWidth / 960;
            svg.style.transform = `scale(${scale})`;
            svg.style.transformOrigin = "top left";
          } else {
            svg.style.transform = "none";
          }
        };
        
        // Initial call and add resize listener
        handleResize();
        window.addEventListener("resize", handleResize);
      })
      .catch(error => {
        console.error("Error loading data:", error);
        if (loadingElement) loadingElement.style.display = 'none';
        if (errorElement) {
          errorElement.style.display = 'block';
          if (errorMessageElement) {
            errorMessageElement.textContent = error.message || "Failed to fetch data. Please try again later.";
          }
        }
      });
    });
  </script>
</body>
</html>
